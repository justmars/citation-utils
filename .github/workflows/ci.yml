name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups --no-sources

      - name: Install Just
        run: sudo apt-get update && sudo apt-get install --yes just

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run repository gate
        run: just check
